name: release

on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # chocolatey needs `choco` (Windows only), so it runs in the next job.
      # Scoop and AUR skip themselves when their secret is empty.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=chocolatey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

  chocolatey:
    needs: goreleaser
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      # Every step is gated on the key (a job-level `if` cannot read secrets),
      # so without it this job is a no-op that still succeeds.
      - if: env.CHOCOLATEY_API_KEY != ''
        run: git config --global core.autocrlf false
      - if: env.CHOCOLATEY_API_KEY != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: env.CHOCOLATEY_API_KEY != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Rebuild and pack only: --skip=publish means nothing is uploaded or pushed.
      - if: env.CHOCOLATEY_API_KEY != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish,homebrew,scoop,aur,aur-source,nfpm,sbom,sign,announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The package points at the zips released from ubuntu. Only push when
      # the rebuilt zips (whose hashes are in the package) are identical.
      - if: env.CHOCOLATEY_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:GITHUB_REF_NAME --pattern checksums.txt --dir released
          $zips = Get-ChildItem dist -Filter '*_windows_*.zip'
          if ($zips.Count -ne 2) { throw "expected 2 windows zips, found $($zips.Count)" }
          foreach ($zip in $zips) {
            $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            if (-not (Select-String -Path released/checksums.txt -Pattern "^$hash\s+$($zip.Name)$" -Quiet)) {
              throw "$($zip.Name) differs from the released archive; not pushing"
            }
          }
          $nupkg = Get-ChildItem dist -Recurse -Filter '*.nupkg'
          if ($nupkg.Count -ne 1) { throw "expected 1 nupkg, found $($nupkg.Count)" }
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { throw "choco push failed" }
