# Waived (flavor, case id, field) triples: [{flavor, id, field: matches|error_message|output|parts|unit, reason}]
#
# js: QuickJS-ng and V8 both reject these patterns (ok=false on both sides) but
# word the SyntaxError differently: V8 prefixes "Invalid regular expression: /<src>/<flags>: "
# and uses its own phrases; QuickJS-ng's lre_compile messages are lowercase and unprefixed.
- flavor: js
  id: errors.unbalanced_open
  field: error_message
  reason: "error message wording: V8 says \"Unterminated group\", QuickJS-ng says \"expecting ')'\""
- flavor: js
  id: errors.unbalanced_close
  field: error_message
  reason: "error message wording: V8 says \"Unmatched ')'\", QuickJS-ng says \"extraneous characters at the end\""
- flavor: js
  id: errors.unclosed_class
  field: error_message
  reason: "error message wording: V8 says \"Unterminated character class\", QuickJS-ng says \"unexpected end\""
